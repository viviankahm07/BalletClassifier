# Input and output directories are set with the --images and --splits flags
# on build_dataset.py (defaults: data/raw_images and data/splits).

classes:
  - first_position
  - second_position
  - third_position
  - fourth_position
  - fifth_position
  - arabesque
  - attitude_derriere
  - attitude_devant
  - passe
  - tendu_devant
  - tendu_a_la_seconde
  - tendu_derriere
  - penche
  - demi_plie
  - grand_plie
  - degage_devant
  - degage_a_la_seconde
  - degage_derriere
  - fondu

splits:
  train: 0.70
  val: 0.15
  test: 0.15
  random_seed: 42
  # Splits are stratified by class when every class has at least 3 samples,
  # so each split keeps a balanced class representation.

image:
  valid_extensions: [".jpg", ".jpeg", ".png"]
  min_images_per_class: 100  # warn if a class has fewer than this
